[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "flowtrail-python"
version = "0.1.0"
description = "Tenant-aware Python AI workflows with persistent checkpoints and a React console"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.124,<1",
  "pydantic>=2.12,<3",
  "httpx>=0.28,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
flowtrail-platform = "flowtrail.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
